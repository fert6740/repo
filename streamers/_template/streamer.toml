# Настройки стримера. Этот файл копируется в streamers/<имя>/ при первом запуске.

twitch_login = ""            # заполняется сам из первой записи
language = "ru"
display_name = ""            # как зовут стримера в роликах (для запроса к нейросети)
intro = "intro.mp4"          # путь к интро от папки стримера; если файла нет — без интро

[transcribe]
# Словарь для распознавания речи: имена, ники, названия игр, мемы канала — whisper будет реже в них ошибаться.
# Названия категорий записи и имя стримера добавляются сами. После изменения: clipper transcribe <запись> --force
vocabulary = []

[clips]
long_min_minutes = 4
long_max_minutes = 25
short_min_sec = 20
short_max_sec = 60

[alerts]
# Плашки донатов. Положите в папку streamers/<имя>/alerts/ вырезанные картинки плашек (png/jpg,
# в масштабе исходного кадра). Если плашка всегда в одном месте, укажите область [x, y, ширина, высота]
# в долях кадра (0–1) — так быстрее и меньше ложных срабатываний; пусто — искать по всему кадру.
region = []
threshold = 0.7              # насколько похоже должно быть (0–1)
fps = 2                      # сколько кадров в секунду проверять

[zoom]
style = "blur_bg"            # вебка ~60 % высоты по центру, под ней размытый затемнённый кадр
height_fraction = 0.6

[chat]
delay_sec = 8                # чат реагирует с опозданием 5–15 с
# Слова и смайлы, по которым сообщение считается «смеховым» (без учёта регистра, ищутся внутри сообщения)
laugh_patterns = [
  "ахах", "хаха", "хах", "аха", "азаз", "пхпх", "ору", "лол", "кек", "рофл", "))",
  "lul", "kekw", "omegalul", "lmao", "lol", "xd", "pepelaugh", "icant", "forsenlaughingathim",
]

[style]
# Примеры удачных названий роликов этого стримера — уходят в запрос как образец стиля
title_examples = []
# Темы, которые не брать (свободным текстом)
banned_topics = []
